<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            width:200px;
            height:200px;
            z-index:5;
        }
        .container{
            font-family: 'sf싸락눈';
            width:660px;
            height:420px;
            margin:10px auto;
        }
        .container h1{text-align: center;}
        .container ul{
            list-style:none;
            padding:0;
        }
        .container li{
            float: left;
            margin:10px;
            padding:0;
            overflow: hidden;
            position:relative;
        }
        .caption{
            position:absolute;
            box-sizing: border-box;
            top:0px;
            width:200px;
            height:400px;
            padding-top:200px;
            background: rgba(0, 0, 0, 0.6);
            color:white;
            text-align: center;
            transition: all 0.6s;
            z-index: 10;
            opacity: 0;
        }
        .caption:hover{
            padding-top:20px;
            height:200px;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>현상수배 목록</h1>
        <ul>
            <li>
                <img src="../img/dog.jpg">
                <div class="caption">
                    <h2>댕댕이</h2>
                    <p>심장에 아주 위협적</p>
                    <p>Only Alive $20,000</p>
                </div>
            </li>
            <li>
                <img src="../img/Teemo.PNG">
                <div class="caption">
                    <h2>티모</h2>
                    <p>티확찢은 진리</p>
                    <p>Dead or Alive $5,000</p>
                </div>
            </li>
            <li>
                <img src="../img/Landing.jpeg">
                <div class="caption">
                    <h2>다람쥐</h2>
                    <p>SUPERHERO LANDING</p>
                    <p>Only Alive $15,000</p>
                </div>
            </li>
        </ul>
    </div>
</body>
</html>
