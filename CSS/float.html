<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family: '카페24 아네모네에어';
            font-size:30pt;
            text-align: center;
        }
        #header, #sidebar, #Rsidebar, #footer{
            border:1px solid black;
        }
        #sidebar, #Rsidebar{
            border-width: 0px 1px;
        }
        #container{
            margin: 30px auto;
            width: 1200px;
        }
        #header{
            width: 1200px;
            height:120px
        }
        #sidebar{
            float: left;
            width:250px;
            height:600px;
        }
        #Rsidebar{
            float: left;
            width:150px;
            height:600px;
        }
        #contents{
            float: left;
            width: 800px;
            height: 600px;
        }
        #footer{
            clear: both;
            width: 1200px;
            height: 100px;
        } 
    </style>
</head>
<body>
    <div id="container">
        <header id="header">
          <h1>사이트 제목</h1>
        </header>
        <aside id="sidebar">
          <h2>사이드바</h2>				
        </aside>
        <section id="contents">
          <h2>본문</h2>
        </section>
        <aside id="Rsidebar">
            <h2>사이드바</h2>
        </aside>
        <footer id="footer">
          <h2>푸터</h2>
        <footer>
      </div>
</body>
</html>
