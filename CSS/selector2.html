<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: 'SF싸락눈';
            font-size:10pt;
        }
        body{background-color: #eee;}
        form{
            border:2px solid black;
            border-radius: 5px;
            background-color: white;
            width:370px;
            height:430px;
            margin:20px auto;
            padding:20px;
        }
        form fieldset{
            margin-bottom: 20px;
            border:1px solid #ccc;
            border-radius: 3px;
        }
        fieldset legend{
            font-weight: 800;
        }
        fieldset label{
            display: inline-block;
            width:110px;
            text-align: center;
        }
        form fieldset:last-child{
            border:0;
            margin-bottom: 0;
        }
        fieldset button{
            width:70px;
            height:35px;
            border:1px solid #333;
            border-radius: 18px;
            background-color: white;
            display: block;
            margin:0 auto;
            letter-spacing: 1px;
            font-size:1em;
        }
        fieldset button:hover{
            background: #333;
            color: white;
        }
        input:not([type=radio]){
            border:1px solid gray;
            border-radius: 3px;
            font-size:13px;
            padding:5px;
            width:200px;
        }
        input[required]{
            border:1px solid red;
        }
        input[readonly]{
            border:0;
        }
    </style>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>로그인 정보</legend>
            <p>
                <label for="id">아이디</label>
                <input type="text" id="id" autofocus required>
            </p>
            <p>
                <label for="pw">비밀번호</label>
                <input type="password" id="pw" required>
            </p>
            <p>
                <label for="pwc">비밀번호 확인</label>
                <input type="password" id="pwc" required>
            </p>
            <p>
                <label for="grade">회원 등급</label>
                <input type="text" id="grade" value="준회원" readonly>
            </p>
        </fieldset>
        <fieldset>
            <legend>개인 정보</legend>
            <p>
                <label for="name">이름</label>
                <input type="text" id="name" placeholder="5자미만 공백없이" required>
            </p>
            <p>
                <label for="email">이메일</label>
                <input type="email" id="email" placeholder="abcd@domain.com" autocomplete="off" required>
            </p>
            <p>
                <label for="phone">연락처</label>
                <input type="tel" id="phone" autocomplete="off">
            </p>
        </fieldset>
        <fieldset class="buttonfield">
            <button type="submit">제출</button>
        </fieldset>
    </form>
</body>
</html>
