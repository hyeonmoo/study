<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노드 생성하기</title>
    <style>
        *{box-sizing: border-box; font-family: sf싸락눈;}
        #container{
            margin:10px auto; padding:0px;
            width:400px;
            border:2px solid black; border-radius: 15px;
        }
        #container h1{
            background-color: black; color:white;
            text-align: center;
            width:100%; height:100px;
            padding-top:40px;
            margin-top:0;
            border-radius: 10px 10px 0 0;
        }
        #container a{font-size:18px; color:black; text-decoration: none;margin:10px;}
        #container a:hover{text-decoration: underline;}
        #info{
            padding:10px; margin:10px auto;
            width:100%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>DOM을 공부합시다</h1>
        <a href="#" id="see">DOM이란?</a>
        <div id="info"></div>
    </div>
    <script>
        let see=document.getElementById("see");
        see.addEventListener('click',addP,{once:true}); //딱 한 번만 실행되도록
        function addP(){
            var newP=document.createElement('p'); // 요소 노드 생성
            var txtNode=document.createTextNode("DOM은 Document Object Model의 약자입니다."); // 텍스트 노드 생성
            newP.appendChild(txtNode); // 요소 노드와 텍스트 노드 연결

            var newImg=document.createElement('img');
            var srcNode=document.createAttribute('src');
            var altNode=document.createAttribute('alt');

            srcNode.value="img/vamilokeycap300.jpg";
            altNode.value='바밀로키캡';

            newImg.setAttributeNode(srcNode);
            newImg.setAttributeNode(altNode);


            document.getElementById("info").appendChild(newP); // id가 info인 노드의 자식노드로 연결
            document.getElementById("info").appendChild(newImg);
        }
    </script>
</body>
</html>
