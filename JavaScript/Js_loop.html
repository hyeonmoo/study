<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documkot</title>
    <style>
        body{
            font-family: sf싸락눈;
            font-size:1.5em;
            line-height: 2;
            text-align: center;
        }
    </style>
</head>
<body>
    <script>
        var sum=0;
        for(var i=1;i<=5;i++){
            sum+=i;
        }
        document.write('<p>1부터 5까지 더하면 '+sum+'</p>');
    </script>
</body>
</html>
