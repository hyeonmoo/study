<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
	<style>
        *{box-sizing:border-box; font-family: sf싸락눈;}
        #container {  
            width:500px;
            margin:20px auto; padding:20px;
        }
        h1{text-shadow: 2px 2px 4px #222;}
        #container>p{
            font-weight: bold;
            text-shadow: 1px 1px 2px #555;
        }
        input[type="text"] {
            width:370px; height:30px;
            float:left;
            padding-left:30px;
            border:1px solid black;
        }
        button {
            width:90px; height:30px;
            float:right;
            background:#000; color:#fff;
            border:none; border-radius: 0 3px 3px 0;
            box-shadow: 1px 1px 2px #222;
        } button:hover{background:#fff;color:#000;}
        hr { clear:both; display:none; }
        ul { list-style:none; padding-top:50px;}
        li { line-height: 2.5; }
        li:hover { cursor:pointer;}
    </style>
</head>
<body>
    <div id="container">
        <h1>Web Programming</h1>
        <p>공부할 주제를 기록해 보세요</p>
        <form action="">
            <input type="text" id="subject">
            <button onclick="newRegister();return false;">추가</button>
        </form>
        <hr>
        <ul id="itemList"></ul>
    </div>
    <script>
        function newRegister(){
            let newItem=document.createElement("li");
            let subject=document.querySelector("#subject");
            let newText=document.createTextNode(subject.value);
            newItem.appendChild(newText);
            let itemList=document.querySelector("#itemList");
            itemList.appendChild(newItem);
            subject.value="";
            let items=document.querySelectorAll("li");
            for(let item of items){
                item.addEventListener("click", function(){
                    if(this.parentNode) this.parentNode.removeChild(this);
                })
            }
        }
    </script>
</body>
</html>
