<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align: center;
            font-family: sf싸락눈;
        }
    </style>
</head>
<body>
    <h1>짝수끼리 더하기</h1>
    <script>
        var n=10;
        var sum=0;
        for(var i=1;i<=n;i++){
            if(i%2)continue;
            sum+=i;
            document.write(i+" ----- "+sum+"<br>");
        }
    </script>
</body>
</html>
