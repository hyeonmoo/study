<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date객체</title>
    <style>
        *{
            box-sizing: border-box;
            font:15pt sf싸락눈;
        }
        #container{
            margin:50px auto;
            width:300px;
            height:300px;
            background-color: #fdd;
            border:5px double #a00;
            border-radius: 150px;
            text-align: center;
            color:#500;
        }
        #container h1{
            width:120px;
            font-size:30pt;
            background-color: #500;
            color:#fdd;
            border-radius: 60px;
            margin:70px auto 0 auto;
            padding-top:5px;
        }
        .accent{font-weight: bold;}
    </style>
</head>
<body>
    <div id="container">
        <h1>책읽기</h1>
        <p><span id="result" class="accent"></span>일 연속으로 <br> 책 읽기를 달성했군요.</p>
        <p>축하합니다!</p>
    </div>

    <script>
        var now=new Date();
        var firstDay=new Date("2022-06-23");

        var toNow=now.getTime();
        var toFirst=firstDay.getTime();
        var passedTime=toNow-toFirst;

        passedTime=Math.round(passedTime/(1000*60*60*24));

        document.querySelector('#result').innerText=passedTime;
    </script>
</body>
</html>
