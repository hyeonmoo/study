<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array객체</title>
    <style>
        *{font: 18pt sf싸락눈;}
    </style>
</head>
<body>
    <script>
        var nums=[1,2,3];
        var chars=['a','b','c','d'];
        
        var numsChars = nums.concat(chars); //nums배열에 chars를 이어붙인 새로운 배열 생성
        var charsNums = chars.concat(nums);
        document.write(`nums에 chars를 합치면 ${numsChars}
        <br>chars에 nums를 합치면 ${charsNums}<br><hr>`);
        
        var string1=nums.join(); //별도의 구분자 없이 요소를 이어서 출력(,)
        document.write(`구분자 없이: ${string1}`);
        var string2=chars.join('/'); // /로 구분해서 요소 출력
        document.write(`<br>'/'구분자 지정: ${string2}<br><hr>`);
        
        var ret1=nums.push(4,5); //해당 인덱스에 요소 추가
        document.write(`length: ${ret1} | 배열: ${nums}<br>`);
        var ret2=nums.unshift(0); //배열 맨 앞에 요소 추가
        document.write(`length: ${ret2} | 배열: ${nums}<br><hr>`);

        var popped1=chars.pop(); //배열 맨 끝 요소 추출
        document.write(`꺼낸 요소: ${popped1} | 배열: ${chars}<br>`);
        var popped2=chars.shift(); //배열의 첫 번째 요소 추출
        document.write(`꺼낸 요소: ${popped2} | 배열: ${chars}<br><hr>`);

        var numbers=[1,2,3,4,5];
        var newNumbers=numbers.splice(2); // 2번 요소부터 끝까지 추출
        document.write(`반환된 배열: ${newNumbers}<br>`);
        document.write(`변경된 배열: ${numbers}<br><hr>`);

        var study=["html","css","web","jquery"];
        var newStudy=study.splice(2,1); //2번 인덱스부터 1개요소 추출
        document.write(`반환된 배열: ${newStudy}<br>`);
        document.write(`변경된 배열: ${study}<br><hr>`);

        var newStudy2=study.splice(2,1,"js"); //2번 인덱스부터 1개 요소 추출 후 추출되어 삭제된 인덱스에 "js" 삽입
        document.write(`반환된 배열: ${newStudy2}<br>`);
        document.write(`변경된 배열: ${study}<br><hr>`);

        var colors=['red','green','blue','white','black'];
        var colors2=colors.slice(2); // 2번 인덱스부터 배열 끝까지의 요소 불러오기
        document.write(`반환된 배열: ${colors2}<br>`);
        document.write(`배열: ${colors}<br><hr>`);

        var colors3=colors.slice(2,4); // 2번 인덱스부터 4번의 전 인덱스까지의 요소 불러오기
        document.write(`반환된 배열: ${colors3}<br><hr>`);
    </script>
</body>
</html>
