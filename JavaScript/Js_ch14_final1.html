<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14장 마무리문제1</title>
    <style>
        *{
            font-family: sf싸락눈;
            text-align: center;
        }
        #container{
            width:400px;
            height:200px;
            margin:20px auto;
            border:1px solid #ccc;
        }
        #container h1{
            width:1fr;
            margin-top:0;
            line-height: 80px;
            background-color: #111;
            color:#ccc;
        }
        #container h2{
            margin-top:50px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>4의 배수일까 아닐까</h1>
        <script>
            var inputNum=prompt('숫자를 입력하시오.');
            if(inputNum){
                if(!(inputNum%4)){
                    document.write('<h2>'+inputNum+"은(는) 4의 배수가 맞다!</h2>");
                }else{
                    document.write('<h2>'+inputNum+"은(는) 4의 배수가 아니다!</h2>");
                }
            } else{
                alert('취소되었습니다.');
            }
        </script>
    </div>
</body>
</html>
