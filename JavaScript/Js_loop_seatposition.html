<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{font-family: sf싸락눈;}
        table{
            border-collapse: collapse;
            border:1px solid black;
        }
        table tr td{
            padding:5px;
            font-size:0.9em;
            border:1px solid black;
        }
    </style>
</head>
<body>
    <h1>자리 배치도</h1>
    <table>
    <script>
        var chair=prompt('전체 좌석 수를 입력하세요');
        var col=prompt('한 줄 당 좌석 수를 입력하세요.');
        var row=Math.ceil(chair/col);
        var cnt=0;
        for(var i=1;i<=row;i++){
            document.write("<tr>");
            for(var j=1;j<=col;j++){
                document.write("<td>좌석 "+(++cnt)+"</td>");
                if(cnt==chair)break;
            }
            document.write("</tr>")
        }
    </script>
    </table>
</body>
</html>
