<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3의 배수 판별기</title>
</head>
<body>
    <script>
        var num = prompt("숫자를 입력하세요");
        if(num){
            (num)?((num%3==0)?alert(num+'은 3의 배수입니다.'):alert(num+'은 3의 배수가 아닙니다.')):alert('입력이 취소되었습니다.');
        } else{
            alert(num);
        }
    </script>
</body>
</html>
