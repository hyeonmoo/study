<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{font-family: sf싸락눈;}
    </style>
</head>
<body>
    <script>
        function sumNum(n){
            let sum=0;
            for(let i=1;i<=n;i++){
                sum+=i;
            }
            document.write('1부터 '+n+'까지의 합은 '+sum+'입니다.');
        }
        var num=prompt('수를 입력하시오.');
        sumNum(num);
    </script>
</body>
</html>
