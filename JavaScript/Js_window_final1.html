<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>현재 시각은?</title>
  <style>
    p {
      margin-top:20px;
      font-size:1.2em;
      text-align: center;
    }
    .display {
      font-size:1.5em; 
      font-weight:bold;
      color:blue;
    }
  </style>
</head>
<body>
    <p><span id="current" class="display"></span></p>
    <script>
        displayNow();
        function displayNow() {
            var now = new Date();
            var currentTime = now.toLocaleTimeString();
            document.querySelector("#current").innerHTML = currentTime;   // id="current" 인 요소에 현재 시간 표시
        }
        setInterval(displayNow, 1000);  // 1초마다 시간 계산 함수 실행
    </script>
</body>
</html>
