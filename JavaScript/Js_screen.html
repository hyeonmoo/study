<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen</title>
    <style>
        *{font:1em sf싸락눈;}
        #container{
            width:400px;
            margin:10px auto;
        }
        .display{
            margin-top:10px;
            padding:10px;
            border:1px solid #222;
            box-shadow: 1px 0 1px #ccc;
        }
        h2{font-size:1.8em;}
    </style>
</head>
<body>
    <div id="container">
        <h2>screen객체</h2>
        <div class="display">
            <script>
                document.write(`<p><b>screen.availWidth: </b>${screen.availWidth}px</p>`);
                document.write(`<p><b>screen.availHeight: </b>${screen.availHeight}px</p>`);
                document.write(`<p><b>screen.width: </b>${screen.width}px</p>`);
                document.write(`<p><b>screen.height: </b>${screen.height}px</p>`);
            </script>
        </div>
    </div>
</body>
</html>
