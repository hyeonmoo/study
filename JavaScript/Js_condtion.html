<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자리 배치도</title>
    <style>
        *{font-family: sf싸락눈;color:#eee}
        body{background-color: #333;}
    </style>
</head>
<body>
    <h1>자리 배치도</h1>
    <script>
        var array = [
            prompt('입장객 수를 입력하세요'),
            prompt('한 줄당 앉을 사람 수')
        ];
        var row=parseInt(array[0]/array[1]);
        if(array[0]%array[1]){
            row++;
        }
        document.write('<p>모두 '+row+'개의 줄이 필요합니다.</p>');
    </script>
</body>
</html>
