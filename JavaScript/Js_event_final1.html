<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>같곱다더</title>
    <style>
        *{text-align: center;}
    </style>
</head>
<body>
    <script>
        var numArray=[
                parseInt(prompt('첫번째 숫자 입력.')),
                parseInt(prompt('두번째 숫자 입력.'))
            ];
        (function sumMulti(x,y){
            if(x===y){
                let mul = x*y;
                document.write(`<h1>${x}X${y}=${mul}</h1>`);
            } else{
                let sum = x+y;
                document.write(`<h1>${x}+${y}=${sum}</h1>`);
            }
        }(numArray[0],numArray[1]));
    </script>
</body>
</html>
