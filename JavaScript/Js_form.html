<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <style>
        *{
            font:1em sf싸락눈;
            box-sizing: border-box;
            border-radius: 0 5px 0 5px;
        }
        #container{
            text-align: center;
            width:500px;
            border:2px solid black;
            padding-bottom:20px;
            border-radius: 0 20px 0 20px;
            margin:50px auto;
        }
        h1{
            font-size:2em;
        }
        #createID{
            width:400px;
            margin: 0 auto;
        }
        #info{
            border-radius: 0 15px 0 15px;
            padding-bottom:0;
            padding-right: 0;
        }
        ul{
            list-style: none;
            padding:0;
            margin-bottom: 0;
            margin-right:10px;
        }
        ul li{
            display: grid;
            grid-template-columns: 1fr 3fr;
            margin: 5px;
        }
        ul li label{
            text-align: center;
            padding-top:3px;
            border-bottom:1px solid black;
        }
        ul li input{
            border:1px solid black;
            font-size:0.8em;
        }
        #info p{
            margin:1px;
            font-size:0.7em;
            text-align: right;
            padding-top:4px;
        }
        #createID button{
            display: inline-block;
            margin:5px auto;
            width:100px;
            height:30px;
            padding-top:3px;
            background-color: black;
            color:white;
        }
        #createID button:hover{
            background-color: #eee;
            color:black;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>회원가입</h1>
        <form action="" id="createID">
            <fieldset id="info">
                <legend>사용자 정보</legend>
                <ul>
                    <li>
                        <label for="userName">이름</label>
                        <input type="text" name="userName" id="userName" required autofocus>
                    </li>
                    <li>
                        <label for="userID">아이디</label>
                        <input type="text" name="userID" id="userID" placeholder="4자~10자 사이,공백없이" minlength="4" maxlength="10" required>
                    </li>
                    <li>
                        <label for="email">이메일</label>
                        <input type="email" name="email" id="email" required>
                    </li>
                    <li>
                        <label for="password">비밀번호</label>
                        <input type="password" name="password" id="password" placeholder="문자와 숫자, 특수기호 포함 8자 이상" minlength="8" required>
                    </li>
                    <li>
                        <label for="passwordConfirm">비밀번호 확인</label>
                        <input type="password" name="passwordConfirm" id="passwordConfirm" required>
                    </li>
                    <li>
                        <label for="phoneNum">휴대폰</label>
                        <input type="tel" name="phonNum" id="phoneNum" placeholder="'-'없이 입력" required>
                    </li>
                </ul>
                <p>모든 항목을 작성한 다음 가입신청하시기 바랍니다</p>
            </fieldset>
            <button type="submit">가입하기</button>
            <button type="reset">다시입력</button>
        </form>
    </div>
</body>
</html>
