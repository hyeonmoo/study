<html lang="ko">
<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>finalTest3</title>
    <style>
        ul{
            list-style: none;
        }
        li{
            float: left;
        }
        a:link, a:visited{
            display: block;
            text-decoration: none;
            color:black;
            font-family: '카페24 아네모네에어';
            padding:10px 20px;
            background-color: #ccc;
        }
        a:hover{
            background-color: black;
            color: #ccc;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="#">메뉴1</a></li>
        <li><a href="#">메뉴2</a></li>
        <li><a href="#">메뉴3</a></li>
        <li><a href="#">메뉴4</a></li>
    </ul>
</body>
