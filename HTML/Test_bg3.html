<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마무리문제3</title>
    <style>
        *{font-family: 'SF싸락눈';}
        body{background-color: #02233b;}
        #container{
            background: url(img/totoro.jpeg) no-repeat right bottom, linear-gradient(white, white);
            background-size: 100px 100px, 600px 700px;
            box-sizing: border-box;
            width:600px;
            height:600px;
            border:1px dotted gray;
            margin:0 auto;
            padding:20px;
        }
        h1{
            background-color: #004343;
            color:white;
            text-align: center;
            padding: 20px;
        }
        h2{
            font-style: italic;
            text-align: center;
            margin-bottom: 50px;
        }
        h3{color:#cf3b00;}
        ul{list-style: none;}
        li{line-height: 30px;}
    </style>
</head>
<body>
    <div id="container">
        <h1>대학언론사 수습기자 모집</h1>
        <h2>신입생 여러분을 기다립니다</h2>
        <h3>모집분야</h3>
        <ul>
            <li>아나운서(0명): 학내 소식을 라디오 방송으로 보도</li>
            <li>오프닝쇼프로듀서(0명): 라디오 방송 기획, 제작</li>
            <li>엔지니어(0명): 라디오 방송 녹음 및 편집</li>
        </ul>
        <h3>혜택</h3>
        <ul>
            <li>수습기자 활동 중 소정의 활동비 지급</li>
            <li>정기자로 진급하면 장학금 지급</li>
        </ul>
    </div>
</body>
</html>
