<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마무리문제1</title>
    <style>
        *{
            padding:0;
            margin:0;
            font-family:'SF싸락눈';
        }
        .bg{
            width:100vw;
            height:100vh;
            background-image: linear-gradient(gray,gray), url(img/coding.jpg);
            background-clip: border-box, border-box;
            background-repeat: no-repeat, repeat-x;
            background-position: 0 top, left 40%;
            background-size: 100% 40%, 100% 100%;
            color:white;
        }
        h1{
            padding:50px 0 0 25px;
            font-size:20px;
        }
        p{
            font-size:15px;
            line-height:25px;
            padding-left: 25px;
        }
    </style>
</head>
<body>
    <div class="bg">
        <h1>웹 디자인 트렌드를 따라잡는 비법 대공개!</h1>
        <p>그래픽 프로그램으로 웹 다지인 요소를 일일이 만들어 웹사이트를 제작하는 시대는 지났다. 이제 모바일, 태블릿, PC 등 멀티 디바이스에 한번에 적용할 수 있는 웹 디자인 방법을 알아야 한다. 바로 코딩을 이용한 웹 디자인이다.</p>
    </div>
    </body>
</html>
